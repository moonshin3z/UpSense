; Monitor de aire - firmware ESP32
; Compilar:          pio run
; Subir firmware:    pio run -t upload
; Subir dashboard:   pio run -t uploadfs   (sube ../dashboard a LittleFS)
; Monitor serie:     pio device monitor

[platformio]
default_envs = esp32dev_bme280
data_dir = ../dashboard

[env]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3

; Configuración de la idea: PMS5003 + MH-Z19C + BME280 (humedad para la calibración)
[env:esp32dev_bme280]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DUSE_BME280
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14

; Alternativa con BME680 (añade resistencia de gas, indicador grueso de VOC; sin BSEC)
[env:esp32dev_bme680]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DUSE_BME680
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit BME680 Library@^2.0.4
    adafruit/Adafruit Unified Sensor@^1.1.14

; Solo PMS5003 + MH-Z19C (sin humedad: la calibración ML no podrá aplicarse)
[env:esp32dev_sin_bme]
board = esp32dev
